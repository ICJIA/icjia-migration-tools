# Nginx reverse proxy for Strapi 5
# Site: v2.hub.icjia-api.cloud → localhost:1337 (default Strapi 5 port)
#
# Two versions below:
#   1. For Laravel Forge — paste into forge-conf/{site-id}/site.conf
#   2. Standalone — if NOT using Forge
#
# IMPORTANT LESSONS (from debugging a 403 on /admin/.strapi/client/app.js):
#   - Do NOT include a dotfile deny rule like: location ~ /\.(?!well-known).* { deny all; }
#     Forge adds this by default. It blocks Strapi 5's admin panel which serves from /.strapi/
#   - Do NOT add extra closing braces } — they close the server block early
#     and orphan location blocks below them (they silently stop working)
#   - Proxy everything to Strapi with one location / block — Strapi handles its own security

# ═══════════════════════════════════════════════════════════════
# VERSION 1: For Laravel Forge (tested, working)
# ═══════════════════════════════════════════════════════════════
# Paste this into: forge-conf/{site-id}/site.conf
# Forge includes site.conf inside the server {} block automatically.
# Do NOT wrap this in a server {} block.
# REMOVE any existing dotfile deny rules (location ~ /\.) in this file.
#
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
# ssl_prefer_server_ciphers off;
# ssl_dhparam /etc/nginx/dhparams.pem;
#
# add_header X-Frame-Options "SAMEORIGIN";
# add_header X-XSS-Protection "1; mode=block";
# add_header X-Content-Type-Options "nosniff";
#
# index index.html index.htm;
# charset utf-8;
#
# include forge-conf/{site-id}/server/*;
#
# location / {
#     proxy_pass http://127.0.0.1:1337;
#     proxy_http_version 1.1;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection 'upgrade';
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_cache_bypass $http_upgrade;
#
#     proxy_read_timeout 300s;
#     proxy_send_timeout 300s;
#     client_max_body_size 200M;
# }
#
# location = /favicon.ico { access_log off; log_not_found off; }
# location = /favicon.svg { access_log off; log_not_found off; }
# location = /robots.txt  { access_log off; log_not_found off; }
#
# access_log off;
# error_log /var/log/nginx/{site-id}-error.log error;
#
# # NO dotfile deny rule — Strapi handles its own security


# ═══════════════════════════════════════════════════════════════
# VERSION 2: Standalone (if NOT using Laravel Forge)
# ═══════════════════════════════════════════════════════════════
# Save to: /etc/nginx/sites-available/v2.hub.icjia-api.cloud
# Then: sudo ln -s /etc/nginx/sites-available/v2.hub.icjia-api.cloud /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    server_name v2.hub.icjia-api.cloud;

    ssl_certificate /etc/letsencrypt/live/v2.hub.icjia-api.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/v2.hub.icjia-api.cloud/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:1337;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 200M;
    }

    # NO dotfile deny rule — Strapi handles its own security
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name v2.hub.icjia-api.cloud;
    return 301 https://$host$request_uri;
}
